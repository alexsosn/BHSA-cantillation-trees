name: pinned-corpus-regeneration

on:
  pull_request:
    paths:
      - ".github/workflows/regenerate-pinned.yml"
      - "src/bhsa_cantillation/**"
      - "tests/test_regeneration.py"

permissions:
  contents: write

concurrency:
  group: pinned-corpus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    # A write-enabled checkout must never execute on untrusted fork PRs.
    if: >-
      github.head_ref == 'data/4-regenerate-pinned' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/4-regenerate-pinned
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest

      - uses: actions/checkout@v4
        with:
          repository: ETCBC/bhsa
          ref: 4db00e2157915495e1a4d3d57e41223df24775da
          path: inputs/bhsa
          sparse-checkout: tf/2021
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openscriptures/morphhb
          ref: 3d15126fb1ef74867fc1434be1942e837932691f
          path: inputs/morphhb
          sparse-checkout: |
            wlc
            structure/OshbVerse/Script/AccentCatalog.js
          filter: blob:none
          persist-credentials: false

      - name: Regenerate pinned 2021 feature data
        run: |
          bhsa-cantillation build \
            --bhsa inputs/bhsa/tf/2021 \
            --morphhb inputs/morphhb \
            --output build/generated/2021 \
            --source-commit 3d15126fb1ef74867fc1434be1942e837932691f

      - name: Compare old features and validate new ones on the real BHSA warp
        run: |
          python -m bhsa_cantillation.regeneration \
            --reference tf/2021 \
            --candidate build/generated/2021 \
            --bhsa inputs/bhsa/tf/2021 \
            --morphhb-sha 3d15126fb1ef74867fc1434be1942e837932691f

      - name: Copy only the eight new feature files
        run: |
          python - <<'PY'
          from pathlib import Path
          from bhsa_cantillation.regeneration import MEASURES

          source = Path("build/generated/2021")
          target = Path("tf/2021")
          for name in MEASURES:
              (target / f"{name}.tf").write_bytes((source / f"{name}.tf").read_bytes())
          PY

      - name: Commit verified generated features back to this PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tf/2021/cantillation_catalog_*.tf tf/2021/cantillation_word_count.tf \
            tf/2021/cantillation_main_*.tf
          if ! git diff --cached --quiet; then
            git commit -m "data: generate pinned 2021 cantillation features (#4)"
            git push origin HEAD:data/4-regenerate-pinned
          fi
