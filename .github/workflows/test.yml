name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest

      - name: End-user non-editable install and public CLI entrypoint smoke
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install .
          .release-smoke/bin/bhsa-cantillation --help > /dev/null
          .release-smoke/bin/bhsa-cantillation build-graph --help > /dev/null
          .release-smoke/bin/bhsa-cantillation boundaries --help > /dev/null
          .release-smoke/bin/bhsa-cantillation compare-halves --help > /dev/null
          .release-smoke/bin/bhsa-cantillation compare-syntax --help > /dev/null
          .release-smoke/bin/bhsa-cantillation syntax-relations --help > /dev/null

