name: build corpus data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "sources.json"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ETCBC/bhsa
          ref: 4db00e2157915495e1a4d3d57e41223df24775da
          path: upstream/bhsa
          sparse-checkout: tf/2021

      - uses: actions/checkout@v4
        with:
          repository: openscriptures/morphhb
          ref: 3d15126fb1ef74867fc1434be1942e837932691f
          path: upstream/morphhb
          sparse-checkout: |
            wlc
            structure/OshbVerse/Script/AccentCatalog.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m pytest --ignore=tests/test_generated_data.py
      - name: Build Text-Fabric module
        run: |
          python -m bhsa_cantillation.cli build \
            --bhsa upstream/bhsa/tf/2021 \
            --morphhb upstream/morphhb \
            --output tf/2021 \
            --source-commit 3d15126fb1ef74867fc1434be1942e837932691f
      - run: python -m pytest tests/test_generated_data.py
      - name: Commit generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tf/2021
          git diff --cached --quiet && exit 0
          git commit -m "Build pinned Text-Fabric data"
          git push
