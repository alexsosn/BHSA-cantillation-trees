name: canonical-graph-integration

on:
  workflow_call:
    inputs:
      concurrency_scope:
        description: Distinguish release verification from standalone PR graph checks
        required: false
        type: string
        default: standalone
  pull_request:
    paths:
      - ".github/workflows/canonical-graph.yml"
      - "src/bhsa_cantillation/graph*.py"
      - "src/bhsa_cantillation/cli.py"
      - "src/bhsa_cantillation/boundaries.py"
      - "src/bhsa_cantillation/syntax_boundary.py"
      - "tests/test_syntax_boundary.py"
      - "tests/test_researcher_quickstart.py"
      - "README.md"
      - "tests/test_boundaries.py"
      - "tests/test_graph*.py"
      - "scripts/audit_syntax_oslots.py"
      - "tests/test_syntax_oslots_audit.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-graph-${{ inputs.concurrency_scope || 'standalone' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest

      - uses: actions/checkout@v4
        with:
          repository: ETCBC/bhsa
          ref: 4db00e2157915495e1a4d3d57e41223df24775da
          path: inputs/bhsa
          sparse-checkout: tf/2021
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openscriptures/morphhb
          ref: 3d15126fb1ef74867fc1434be1942e837932691f
          path: inputs/morphhb
          sparse-checkout: |
            wlc
            structure/OshbVerse/Script
          filter: blob:none
          persist-credentials: false

      - name: Research gate - audit pinned BHSA syntax oslots topology
        run: |
          python scripts/audit_syntax_oslots.py \
            --bhsa inputs/bhsa/tf/2021 \
            --bhsa-commit 4db00e2157915495e1a4d3d57e41223df24775da \
            --output build/syntax-oslots-audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("build/syntax-oslots-audit.json").read_text())
          assert data["verse_count"] == 23213
          assert {kind: entry["nodes"] for kind, entry in data["types"].items()} == {
              "clause": 88131, "clause_atom": 90704,
              "phrase": 253203, "phrase_atom": 267532,
          }
          for kind, entry in data["types"].items():
              assert entry["nodes"] == (
                  entry["assigned_to_verse"] + entry["cross_verse"]
                  + entry["unassigned_slots"] + entry["missing_slots"]
              ), (kind, entry)
          print("Pinned syntax oslots membership and denominators validated")
          print("Pairwise relation counts:", data["relations"])
          print("Real crossing examples:", data["examples"]["crossing"])
          print("Real discontinuous examples:", data["examples"]["gapped"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pinned-syntax-oslots-audit
          path: build/syntax-oslots-audit.json
          retention-days: 14

      - name: Build full derived cantillation graph and verify all 23,213 trees
        run: |
          bhsa-cantillation build-graph \
            --bhsa inputs/bhsa/tf/2021 \
            --module tf/2021 \
            --morphhb inputs/morphhb \
            --output build/canonical-graph/2021 \
            --source-commit 3d15126fb1ef74867fc1434be1942e837932691f

      - name: Assert pinned node counts and stable BHSA IDs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/canonical-graph/2021/graph-build-stats.json")
          stats = json.loads(path.read_text(encoding="utf-8"))
          assert stats == {
              "verses": 23213,
              "source_words": 305507,
              "units": 165747,
              "phrases": 142534,
              "fuzzy_verses": 10,
              "original_max_node": 1446831,
              "derived_max_node": 2060619,
          }, stats
          print("Verified complete graph:", stats)
          PY
          du -sh build/canonical-graph/2021

      - name: End-user README quickstart smoke on original Gen.1.1
        run: |
          # Same documented commands and file paths as a fresh researcher clone.
          bhsa-cantillation compare-syntax \
            --graph build/canonical-graph/2021 \
            --verse Gen.1.1 \
            --format tsv --output build/genesis-1-1-syntax.tsv
          bhsa-cantillation compare-halves \
            --graph build/canonical-graph/2021 \
            --verse Gen.1.1 \
            --format jsonl --output build/genesis-1-1-halves.jsonl
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          from bhsa_cantillation.boundaries import load_boundary_api

          with Path("build/genesis-1-1-syntax.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              syntax = list(csv.DictReader(handle, delimiter="\t"))
          assert syntax
          assert {row["osis_id"] for row in syntax} == {"Gen.1.1"}
          by_id = {row["phrase_id"]: row for row in syntax}
          assert all(row["slot_status"] == "comparable" for row in by_id.values())
          yes = by_id["Gen.1.1#p1-2"]
          no = by_id["Gen.1.1#p3-4"]
          assert yes["ends_phrase"] == "True"
          assert "651573" in yes["phrase_nodes"].split(";")
          assert no["ends_phrase"] == "False"
          assert no["phrase_nodes"] == ""

          api = load_boundary_api(Path("build/canonical-graph/2021"))
          assert api.F.otype.v(651573) == "phrase"
          original = set(api.E.oslots.s(651573))
          assert original
          assert max(original) == int(yes["bhsa_cut_after_slot"])
          assert int(yes["cut_after_word_index"]) > 0
          half = [
              json.loads(line)
              for line in Path("build/genesis-1-1-halves.jsonl")
                  .read_text(encoding="utf-8").splitlines()
          ]
          assert len(half) == 1
          assert half[0]["osis_id"] == "Gen.1.1"
          assert half[0]["status"] == "match"
          print("README first-analysis E2E verified from original pinned oslots")
          PY

      - name: Export and independently cross-check all saved phrase boundaries
        run: |
          bhsa-cantillation boundaries \
            --graph build/canonical-graph/2021 --format jsonl \
            --output build/boundaries.jsonl
          bhsa-cantillation boundaries \
            --graph build/canonical-graph/2021 --format jsonl \
            --output build/boundaries-again.jsonl
          cmp build/boundaries.jsonl build/boundaries-again.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          from tf.fabric import Fabric

          source = Path("build/canonical-graph/2021")
          api = Fabric(locations=str(source), silent="deep").load(
              "cantillation_main_cut_word_index cantillation_word_count", silent="deep"
          )
          assert api is not None
          count = 0
          keys = set()
          root_cuts = {}
          previous = None
          for line in Path("build/boundaries.jsonl").open(encoding="utf-8"):
              record = json.loads(line)
              count += 1
              key = (record["verse_node"], record["phrase_id"])
              assert key not in keys, key
              keys.add(key)
              order = (record["verse_node"], record["first_unit"], record["last_unit"])
              assert previous is None or order > previous, (previous, order)
              previous = order
              assert record["phrase_word_count"] == (
                  record["first_child_word_count"] + record["second_child_word_count"]
              )
              assert record["phrase_first_word_index"] <= record["cut_after_word_index"]
              assert record["cut_after_word_index"] < record["phrase_last_word_index"]
              if record["depth"] == 0:
                  verse = record["verse_node"]
                  assert verse not in root_cuts
                  root_cuts[verse] = record["cut_after_word_index"]
                  assert record["cut_after_word_index"] == int(
                      api.F.cantillation_main_cut_word_index.v(verse)
                  )
                  assert record["phrase_word_count"] == int(
                      api.F.cantillation_word_count.v(verse)
                  )
          assert count == 142534, count
          assert len(root_cuts) == 23202, len(root_cuts)
          assert "Gen.1.1" in {key[1].split("#", 1)[0] for key in keys}
          for verse in api.F.otype.s("verse"):
              assert (api.F.cantillation_main_cut_word_index.v(verse) is None) == (
                  verse not in root_cuts
              )
          print("Verified persisted boundaries, root source coordinates and determinism")
          PY

      - name: Cross-check selected OSIS boundaries against full pinned export
        run: |
          bhsa-cantillation boundaries \
            --graph build/canonical-graph/2021 --format jsonl \
            --verse Gen.1.2 --verse Gen.1.1 --verse Gen.1.1 \
            --output build/selected-boundaries.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          def read(path):
              return [
                  json.loads(line)
                  for line in Path(path).read_text(encoding="utf-8").splitlines()
              ]

          chosen = {"Gen.1.1", "Gen.1.2"}
          expected = [
              row for row in read("build/boundaries.jsonl")
              if row["osis_id"] in chosen
          ]
          selected = read("build/selected-boundaries.jsonl")
          assert selected == expected
          assert {row["osis_id"] for row in selected} == chosen
          print(f"Selective boundary export matches {len(selected)} canonical full-export rows")
          PY

      - name: E2E compare pinned BHSA half-verse spans to saved cantillation root cuts
        run: |
          bhsa-cantillation compare-halves \
            --graph build/canonical-graph/2021 --format jsonl \
            --output build/half-verse-comparison.jsonl
          bhsa-cantillation compare-halves \
            --graph build/canonical-graph/2021 --format tsv \
            --verse Ps.36.1 --verse Gen.35.22 --verse Gen.7.11 \
            --verse Gen.1.13 --verse Gen.1.1 \
            --output build/half-verse-selected.tsv
          # Select a *verified* mismatch rather than assuming an old
          # mismatch label remains valid after root-slot validation changes.
          mismatch_osis="$(python - <<'PY'
          import json
          from pathlib import Path

          with Path("build/half-verse-comparison.jsonl").open(encoding="utf-8") as handle:
              for line in handle:
                  row = json.loads(line)
                  if row["status"] == "mismatch":
                      print(row["osis_id"])
                      break
              else:
                  raise ValueError("No pinned half-verse mismatch to smoke-test")
          PY
          )"
          bhsa-cantillation compare-halves \
            --graph build/canonical-graph/2021 --format tsv \
            --verse "$mismatch_osis" \
            --output build/half-verse-mismatch.tsv
          python - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          from bhsa_cantillation.boundaries import load_boundary_api

          path = Path("build/half-verse-comparison.jsonl")
          rows = [json.loads(line) for line in path.open(encoding="utf-8")]
          assert len(rows) == 23213
          assert [r["verse_node"] for r in rows] == list(range(1414389, 1437602))
          assert Counter(r["half_verse_count"] for r in rows) == {
              1: 1603, 2: 21254, 3: 356,
          }
          assert sum(r["alignment"] == "fuzzy" for r in rows) == 10
          assert sum(r["status"] == "no_root_split" for r in rows) == 11
          assert sum(r["status"] in ("match", "mismatch") for r in rows) > 0

          by_id = {r["osis_id"]: r for r in rows}
          assert len(by_id) == len(rows)
          assert by_id["Gen.1.13"]["status"] == "nonbinary_half_verse"
          assert by_id["Gen.35.22"]["half_verse_count"] == 3
          assert by_id["Ezek.32.30"]["half_verse_count"] == 3
          assert by_id["Ps.36.1"]["status"] == "no_root_split"
          assert by_id["Gen.7.11"]["status"] == "ambiguous_root_slots"
          chosen = {"Gen.1.1", "Gen.1.13", "Gen.7.11", "Gen.35.22", "Ps.36.1"}
          with Path("build/half-verse-selected.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              selected = list(csv.DictReader(handle, delimiter="\t"))
          expected = [
              {key: "" if value is None else str(value) for key, value in row.items()}
              for row in rows if row["osis_id"] in chosen
          ]
          assert selected == expected
          true_mismatch = next(r for r in rows if r["status"] == "mismatch")
          with Path("build/half-verse-mismatch.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              chosen_mismatch = list(csv.DictReader(handle, delimiter="\t"))
          assert chosen_mismatch == [{
              key: "" if value is None else str(value)
              for key, value in true_mismatch.items()
          }]
          print("Independently smoked a true pinned mismatch:", true_mismatch["osis_id"])

          api = load_boundary_api(Path("build/canonical-graph/2021"))
          roots = {
              r["root_phrase_node"]
              for r in rows if r["status"] in ("match", "mismatch")
          }
          root_children = {}
          for child, targets in api.E.cant_parent.data.items():
              for parent, position in targets.items():
                  if parent in roots:
                      root_children.setdefault(parent, {})[position] = child
          assert set(root_children) == roots
          for row in rows:
              parts = row["half_verse_nodes"].split(";") if row["half_verse_nodes"] else []
              assert len(parts) == row["half_verse_count"]
              if row["status"] not in ("match", "mismatch"):
                  continue
              children = root_children[row["root_phrase_node"]]
              assert set(children) == {1, 2}
              first_half = int(parts[0])
              left = set(api.E.oslots.s(children[1]))
              right = set(api.E.oslots.s(children[2]))
              verse_slots = set(api.E.oslots.s(row["verse_node"]))
              assert left and right and not left & right
              assert left | right == verse_slots
              assert len(left) == max(left) - min(left) + 1
              assert len(right) == max(right) - min(right) + 1
              assert max(left) + 1 == min(right)
              agreed = set(api.E.oslots.s(first_half)) == left
              assert agreed == (row["status"] == "match"), row

          statuses = Counter(r["status"] for r in rows)
          assert statuses == {
              "match": 20991, "mismatch": 43, "ambiguous_root_slots": 212,
              "nonbinary_half_verse": 1948, "no_root_split": 11, "fuzzy_alignment": 8,
          }, statuses
          mismatches = [r["osis_id"] for r in rows if r["status"] == "mismatch"]
          print("Pinned half-verse status counts:", dict(sorted(statuses.items())))
          print("First exact-alignment mismatches:", mismatches[:10])
          print("Verified 23,213 saved-graph/BHSA comparisons and selected TSV CLI")
          PY

      - name: E2E compare all saved cuts to original BHSA syntax endings
        run: |
          bhsa-cantillation compare-syntax \
            --graph build/canonical-graph/2021 --format jsonl \
            --output build/syntax-endings.jsonl > build/syntax-summary.json
          bhsa-cantillation compare-syntax \
            --graph build/canonical-graph/2021 --format jsonl \
            --output build/syntax-endings-again.jsonl
          cmp build/syntax-endings.jsonl build/syntax-endings-again.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [
              json.loads(line) for line in
              Path("build/syntax-endings.jsonl").read_text(encoding="utf-8").splitlines()
          ]
          summary = json.loads(Path("build/syntax-summary.json").read_text())
          assert len(rows) == 142534
          assert summary["cuts"] == len(rows)
          assert 0 < summary["comparable"] < len(rows)
          assert summary["status_counts"]["comparable"] == summary["comparable"]
          assert sum(summary["status_counts"].values()) == len(rows)
          assert summary["syntax_node_exclusions_global"]["phrase"]["cross_verse"] == 15
          assert summary["syntax_node_exclusions_global"]["clause"]["cross_verse"] == 50
          assert summary["syntax_node_exclusions_global"]["phrase_atom"]["cross_verse"] == 0
          assert summary["syntax_node_exclusions_global"]["clause_atom"]["cross_verse"] == 0
          assert all(r["ends_phrase"] is None for r in rows
                     if r["slot_status"] != "comparable")
          assert all(
              r["bhsa_cut_after_slot"] is not None
              for r in rows if r["slot_status"] == "comparable"
          )
          assert all(
              sum(r[f"ends_{kind}"] is True for r in rows)
              == summary["matches_by_type"][kind]
              for kind in ("phrase", "phrase_atom", "clause", "clause_atom")
          )
          positives = [r for r in rows if r["slot_status"] == "comparable"
                       and r["ends_phrase"]]
          negatives = [r for r in rows if r["slot_status"] == "comparable"
                       and not r["ends_phrase"]]
          assert positives and negatives
          yes, no = positives[0], negatives[0]
          Path("build/syntax-selected-ids.txt").write_text(
              yes["osis_id"] + "\n" + no["osis_id"] + "\n", encoding="utf-8"
          )
          Path("build/syntax-sample-rows.json").write_text(
              json.dumps({"yes": yes, "no": no}, ensure_ascii=False)
          )
          print("All pinned syntax cut statuses:", summary["status_counts"])
          print("First real phrase-ending coincidence:", yes["osis_id"],
                yes["phrase_id"], yes["phrase_nodes"])
          print("First real noncoincidence:", no["osis_id"], no["phrase_id"])
          PY
          readarray -t chosen < build/syntax-selected-ids.txt
          bhsa-cantillation compare-syntax \
            --graph build/canonical-graph/2021 --format tsv \
            --verse "${chosen[1]}" --verse "${chosen[0]}" \
            --verse "${chosen[0]}" \
            --output build/syntax-selected.tsv
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          from bhsa_cantillation.boundaries import load_boundary_api

          samples = json.loads(Path("build/syntax-sample-rows.json").read_text())
          rows = [
              json.loads(line) for line in
              Path("build/syntax-endings.jsonl").read_text(encoding="utf-8").splitlines()
          ]
          chosen = {samples["yes"]["osis_id"], samples["no"]["osis_id"]}
          with Path("build/syntax-selected.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              selected = list(csv.DictReader(handle, delimiter="\t"))
          expected = [
              {key: "" if value is None else str(value) for key, value in row.items()}
              for row in rows if row["osis_id"] in chosen
          ]
          assert selected == expected

          api = load_boundary_api(Path("build/canonical-graph/2021"))
          for label, row in samples.items():
              assert row["slot_status"] == "comparable"
              cut = row["bhsa_cut_after_slot"]
              verse_slots = set(api.E.oslots.s(row["verse_node"]))
              if label == "yes":
                  syntax_nodes = [int(n) for n in row["phrase_nodes"].split(";")]
                  assert syntax_nodes
                  for n in syntax_nodes:
                      assert api.F.otype.v(n) == "phrase"
                      slots = set(api.E.oslots.s(n))
                      assert slots <= verse_slots and max(slots) == cut
              else:
                  # Genuine negative: independently inspect *all* original
                  # BHSA phrase nodes, including gapped and cross-verse ones.
                  assert not any(
                      set(api.E.oslots.s(node)) <= verse_slots
                      and max(api.E.oslots.s(node)) == cut
                      for node in api.F.otype.s("phrase")
                      if api.E.oslots.s(node)
                  )
          print("Independently verified real positive/negative and selected TSV")
          PY

      - name: E2E original-slot-set syntax relations with real crossing
        run: |
          # Run the documented end-user command on 31 genuine Genesis verses.
          verses=()
          for n in $(seq 1 31); do
            verses+=(--verse "Gen.1.$n")
          done
          # Researcher command: select a full chapter, not 31 hand-written verse flags.
          bhsa-cantillation syntax-relations \
            --graph build/canonical-graph/2021 \
            --book Gen --chapter 1 --format jsonl \
            --output build/syntax-relations.jsonl > build/syntax-relations-summary.json
          bhsa-cantillation syntax-relations \
            --graph build/canonical-graph/2021 \
            "${verses[@]}" --format jsonl \
            --output build/syntax-relations-again.jsonl
          cmp build/syntax-relations.jsonl build/syntax-relations-again.jsonl
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          from bhsa_cantillation.boundaries import load_boundary_api

          rows = [
              json.loads(line) for line in
              Path("build/syntax-relations.jsonl").read_text(encoding="utf-8").splitlines()
          ]
          summary = json.loads(
              Path("build/syntax-relations-summary.json").read_text(encoding="utf-8")
          )
          assert rows
          assert {row["osis_id"] for row in rows} == {
              f"Gen.1.{n}" for n in range(1, 32)
          }
          assert all(row["verse_node"] in range(1414389, 1437602) for row in rows)
          phrases = {}
          for row in rows:
              key = row["phrase_node"]
              assert key not in phrases or phrases[key] == row["slot_status"]
              phrases[key] = row["slot_status"]
          assert len(phrases) == summary["cuts"]
          assert Counter(phrases.values()) == summary["status_counts"]
          actual = [row for row in rows if row["relation"] is not None]
          assert len(actual) == summary["comparisons"]
          assert Counter(row["relation"] for row in actual) == summary["relation_counts"]
          assert summary["syntax_node_exclusions_global"]["phrase"]["cross_verse"] == 15
          assert summary["syntax_node_exclusions_global"]["clause"]["cross_verse"] == 50

          api = load_boundary_api(Path("build/canonical-graph/2021"))
          for row in actual:
              assert row["slot_status"] == "comparable"
              assert api.F.otype.v(row["phrase_node"]) == "cant_phrase"
              assert api.F.otype.v(row["syntax_node"]) == row["syntax_type"]
              cant = set(api.E.oslots.s(row["phrase_node"]))
              syntax = set(api.E.oslots.s(row["syntax_node"]))
              assert cant and syntax
              assert cant <= set(api.E.oslots.s(row["verse_node"]))
              assert syntax <= set(api.E.oslots.s(row["verse_node"]))
              # Independently derive set logic from saved original oslots,
              # not from the implementation's classifier or range parser.
              if cant == syntax:
                  expected = "exact"
              elif cant < syntax:
                  expected = "inside"
              elif syntax < cant:
                  expected = "contains"
              elif not cant.isdisjoint(syntax):
                  expected = "crossing"
              else:
                  expected = "disjoint"
              assert row["relation"] == expected, row

          crossings = [row for row in actual if row["relation"] == "crossing"]
          assert crossings, "No real cantillation/BHSA crossing in Genesis 1 sample"
          one = crossings[0]
          Path("build/real-syntax-crossing-osis.txt").write_text(
              one["osis_id"] + "\n", encoding="utf-8"
          )
          print("Verified original BHSA relations:", len(actual),
                "pairs; real crossing", one["osis_id"],
                one["phrase_id"], one["syntax_node"])
          PY
          crossing_osis="$(cat build/real-syntax-crossing-osis.txt)"
          bhsa-cantillation syntax-relations \
            --graph build/canonical-graph/2021 \
            --verse "$crossing_osis" --verse "$crossing_osis" \
            --format tsv --output build/real-syntax-crossing.tsv
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          osis = Path("build/real-syntax-crossing-osis.txt").read_text().strip()
          expected = [
              {key: "" if value is None else str(value) for key, value in row.items()}
              for row in map(json.loads, Path("build/syntax-relations.jsonl")
                             .read_text(encoding="utf-8").splitlines())
              if row["osis_id"] == osis
          ]
          with Path("build/real-syntax-crossing.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              actual = list(csv.DictReader(handle, delimiter="\t"))
          assert actual == expected
          assert any(row["relation"] == "crossing" for row in actual)
          print("Selected original-slot crossing verified via end-user TSV CLI", osis)
          PY
